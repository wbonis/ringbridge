services:
  ringbridge:
    # build in addition to image: with image alone, "docker compose
    # restart" keeps running the old image even after a rebuild. With both,
    # "up -d --build" rebuilds and replaces the container in one step.
    build: .
    image: ringbridge:local
    container_name: ringbridge
    restart: unless-stopped
    depends_on:
      - mediamtx
    volumes:
      - ./config:/config
      # Working directory (clips, stills, concat files).
      #
      # Deliberately a bind onto /tmp and NOT a tmpfs inside the container:
      # on this host /tmp already is a tmpfs (1.9 GB), so the contents live
      # in RAM either way. A container tmpfs would change nothing about
      # that, but it is wiped on every "up -d" - and that would take away
      # what _fallback_clip() relies on: after a restart there would be no
      # earlier clip left to fall back to. The host's /tmp survives
      # container restarts and is only cleared on reboot.
      #
      # If you want a hard ceiling, put it on the HOST as a dedicated tmpfs
      # at /tmp/ringbridge - then the limit applies and the fallback
      # survives.
      - /tmp/ringbridge:/working
      # Log timestamps in the host's timezone. Mounted rather than a fixed
      # TZ= value so the container follows the host instead of drifting after
      # a change. Correlating a ringbridge line with a Ring event or a Frigate
      # entry meant adding two hours in your head otherwise.
      - /etc/localtime:/etc/localtime:ro
    tty: true # for color logs
    environment:
      - RINGBRIDGE_CONFIG=/config/config.json

  # Its own MediaMTX instance. Deliberately NOT sharing the one from a
  # neighbouring stack: a "compose down" over there would take all Ring
  # streams with it. Each stack stands on its own.
  mediamtx:
    image: bluenviron/mediamtx
    container_name: mediamtx-ring   # globally unique; within its own
                                    # network the DNS name stays "mediamtx"
    restart: unless-stopped
    environment:
      # 8555 rather than the default 8554, leaving that free for a
      # neighbouring stack. Same port inside and outside, so RTSP never
      # reports a port that differs from the one clients connected to.
      - MTX_RTSPADDRESS=:8555
      # forces TCP for publishers AND readers. Over UDP the I-frames of
      # high-resolution cameras get torn apart ("invalid FU-A packet").
      - MTX_RTSPTRANSPORTS=tcp
    volumes:
      # Same reason as above, so its lines line up with ringbridge's.
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 8555:8555
